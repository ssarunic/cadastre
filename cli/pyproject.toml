[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadastral-cli"
version = "0.4.0"
description = "Command-line interface for Croatian Cadastral System API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
]

dependencies = [
    "croatian-cadastral-api>=0.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pylint>=3.0.0",
    "polib>=1.2.0",  # documentation build and gate (scripts/build_docs.py)
    # po/*.po also translate click's own messages, which differ between click
    # releases; the translation gate needs the exact version the catalog was
    # extracted from. Runtime keeps the range above (newer click just shows
    # its few new messages untranslated).
    "click==8.5.0",
]

[project.scripts]
cadastral = "cadastral_cli.main:cli"
uz = "cadastral_cli.main:cli"  # Croatian program name (uređena zemlja)

[project.urls]
Homepage = "https://github.com/yourusername/croatian-cadastral-api"
Documentation = "https://github.com/yourusername/croatian-cadastral-api/blob/main/cli/README.md"
Repository = "https://github.com/yourusername/croatian-cadastral-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=cadastral_cli --cov-report=term-missing"

[tool.pylint.main]
py-version = "3.12"
jobs = 0  # Use all available CPUs

[tool.pylint.messages_control]
# Disable some overly strict checks while keeping best practices
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "fixme",  # Allow TODO comments
]

[tool.pylint.format]
max-line-length = 100  # Match ruff configuration

[tool.pylint.design]
max-attributes = 12
max-args = 8

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "ok", "cli"]
